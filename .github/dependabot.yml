version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # Boot 4 uses Jackson 3 and requires a coordinated application migration.
    # Keep compatible Boot 3 patch/minor proposals enabled.
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly