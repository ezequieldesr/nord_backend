spring.application.name=nord
# Perfil seguro por padrão. Desenvolvimento exige SPRING_PROFILES_ACTIVE=dev.
spring.profiles.default=prod

server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Mensagens de validação sempre em português
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# A interface é servida pelo Next.js; este serviço expõe somente a API.
spring.web.resources.add-mappings=false
