# Tudo vem de variáveis de ambiente. Sem JWT_SECRET a aplicação NÃO sobe (de propósito).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# Só preencha se o front estiver em OUTRO domínio (ex.: https://minha-loja.vercel.app)
app.cors.allowed-origins=${CORS_ORIGINS:}

# Opcional: cria o primeiro admin se ainda não existir
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
